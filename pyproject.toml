[project]
name = "pusht-dp"
version = "0.1.0"
description = "Learning diffusion policies on Push-T (keypoint observations)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy",
    "datasets>=3.0",
    "gym-pusht>=0.1.5",
    "matplotlib",
    "imageio[ffmpeg]",
    "wandb",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pusht_dp"]

# On Windows/Linux, pull CUDA builds of torch (PyPI's Windows wheel is CPU-only).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
